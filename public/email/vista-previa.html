<!DOCTYPE html>
<!-- Solo para revisar las plantillas en el host: rellena las {{variables}} con datos de ejemplo. -->
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Vista previa de correos</title>
<style>
  body { margin:0; background:#050505; font-family: system-ui, sans-serif; color:#aaa; }
  nav { display:flex; gap:8px; padding:16px; position:sticky; top:0; background:#050505; z-index:1; }
  button { background:#1a1a1a; color:#ddd; border:1px solid #333; border-radius:999px; padding:8px 16px; cursor:pointer; }
  button.on { border-color:#7e6e87; color:#ded0e8; }
  iframe { display:block; width:100%; height:1500px; border:0; }
</style>
</head>
<body>
<nav>
  <button data-f="prospecto.html" class="on">Para ti: ¡Tienes nuevo prospecto!</button>
  <button data-f="cliente.html">Para el cliente: confirmación</button>
</nav>
<iframe id="v" title="Vista previa"></iframe>
<script>
  const sample = {
    nombre: 'Laura Gómez', cargo: 'Directora de Operaciones', empresa: 'Nube Andina',
    email: 'laura@ejemplo.com', telefono: '+58 4121234567', pais: 'Venezuela',
    estado: 'En fase inicial (Diseño o requerimientos)',
    problema: 'Queremos automatizar la atención a clientes y ordenar el seguimiento de pedidos, hoy todo pasa por WhatsApp y hojas de cálculo.',
    fecha_1: '18-11-2026', fecha_2: '19-11-2026', fecha_3: '21-11-2026', web: location.origin,
  };
  const show = async (f) => {
    const html = await (await fetch(f)).text();
    document.getElementById('v').srcdoc = html.replace(/\{\{(\w+)\}\}/g, (_, k) => sample[k] ?? '');
    document.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.f === f));
  };
  document.querySelectorAll('button').forEach((b) => (b.onclick = () => show(b.dataset.f)));
  show('prospecto.html');
</script>
</body>
</html>
